<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title description">
  <title id="title">NianJiu's open-source portfolio</title>
  <desc id="description">A visual overview of merged open-source contributions, including 56 OpenClaw PRs and MiniMax CLI maintenance.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07162e" />
      <stop offset="0.5" stop-color="#0b2450" />
      <stop offset="1" stop-color="#16114a" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4" />
      <stop offset="1" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="accentWarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9a8d4" />
      <stop offset="1" stop-color="#c084fc" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#020617" flood-opacity="0.36" />
    </filter>
  </defs>

  <rect width="1200" height="670" rx="36" fill="url(#background)" />
  <circle cx="1110" cy="50" r="180" fill="#38bdf8" opacity="0.08" />
  <circle cx="100" cy="660" r="220" fill="#a78bfa" opacity="0.1" />
  <path d="M0 492C182 438 291 540 474 500S780 392 1200 460V670H0Z" fill="#0f3d74" opacity="0.25" />

  <text x="70" y="88" fill="#bfdbfe" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4">NIANJIU / OPEN SOURCE</text>
  <text x="70" y="138" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Building dependable agent systems</text>
  <text x="70" y="173" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="20">Production-minded contributions across AI agents, CLIs, browser tooling, and frontend systems.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="220" width="674" height="166" rx="24" fill="#102f5b" stroke="#3b82f6" stroke-opacity="0.48" />
    <rect x="70" y="220" width="12" height="166" rx="6" fill="url(#accent)" />
    <text x="112" y="266" fill="#e0f2fe" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">OPENCLAW</text>
    <text x="112" y="307" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">56 merged PRs</text>
    <text x="112" y="342" fill="#bfdbfe" font-family="Arial, Helvetica, sans-serif" font-size="18">Channel delivery · Agent runtime · Gateways · Mobile reliability</text>
    <circle cx="683" cy="302" r="46" fill="#1e40af" />
    <path d="M667 302l11 11 23-26" fill="none" stroke="#dbeafe" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <rect x="772" y="220" width="358" height="166" rx="24" fill="#24205e" stroke="#a78bfa" stroke-opacity="0.52" />
    <rect x="772" y="220" width="12" height="166" rx="6" fill="url(#accentWarm)" />
    <text x="814" y="266" fill="#f3e8ff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">MINIMAX CLI</text>
    <text x="814" y="307" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Maintainer</text>
    <text x="814" y="342" fill="#ddd6fe" font-family="Arial, Helvetica, sans-serif" font-size="18">18 merged PRs</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="416" width="326" height="150" rx="22" fill="#123c5a" stroke="#2dd4bf" stroke-opacity="0.42" />
    <text x="104" y="460" fill="#ccfbf1" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">MASTRA</text>
    <text x="104" y="501" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">2 merged PRs</text>
    <text x="104" y="535" fill="#99f6e4" font-family="Arial, Helvetica, sans-serif" font-size="16">Agent runtime &amp; RAG correctness</text>

    <rect x="435" y="416" width="326" height="150" rx="22" fill="#203b5d" stroke="#60a5fa" stroke-opacity="0.42" />
    <text x="469" y="460" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">BROWSERSKILL</text>
    <text x="469" y="501" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">3 merged PRs</text>
    <text x="469" y="535" fill="#bfdbfe" font-family="Arial, Helvetica, sans-serif" font-size="16">CLI health · Daemon lifecycle · CI</text>

    <rect x="800" y="416" width="330" height="150" rx="22" fill="#3b2255" stroke="#f0abfc" stroke-opacity="0.42" />
    <text x="834" y="460" fill="#fae8ff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">OPENAGENT</text>
    <text x="834" y="501" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">10 merged PRs</text>
    <text x="834" y="535" fill="#f5d0fe" font-family="Arial, Helvetica, sans-serif" font-size="16">UI foundations &amp; product polish</text>
  </g>

  <line x1="70" y1="606" x2="1130" y2="606" stroke="#93c5fd" stroke-opacity="0.22" />
  <text x="70" y="638" fill="#bfdbfe" font-family="Arial, Helvetica, sans-serif" font-size="16">Verified 2026-07-17</text>
  <text x="1130" y="638" text-anchor="end" fill="#bfdbfe" font-family="Arial, Helvetica, sans-serif" font-size="16">github.com/NianJiuZst</text>
</svg>
